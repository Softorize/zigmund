name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2
      - name: Run tests
        run: zig build test
      - name: Run perf benchmark families (shared CI mode)
        env:
          PERF_GATE_MODE: shared
        run: sh tools/perf/run_perf_suite.sh
      - name: Generate parity matrix
        run: zig build parity-report
      - name: Enforce parity gate (full baseline coverage)
        env:
          PARITY_MAX_STUB: "0"
          PARITY_MAX_MISSING: "0"
        run: sh tools/parity/check_parity_gate.sh
      - name: Generate SBOM
        run: zig build run -- sbom --out zigmund.sbom.json
      - name: Governance checks
        run: sh tools/release/check_governance.sh
      - name: Build release artifacts
        run: sh tools/release/build_release_artifacts.sh
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: zigmund-sbom
          path: zigmund.sbom.json
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigmund-release
          path: dist/release/*
